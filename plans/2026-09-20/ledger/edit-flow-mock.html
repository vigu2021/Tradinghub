<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account edit flows</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ground:#f5f5f1; --surface:#ebece7; --ink:#202320; --ink-dim:#4d524c; --ink-faint:#676c65; --rule:#dde0d9; --control:#868b84; --accent:#9a4d28; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:Archivo, sans-serif; }
  .wrap { max-width:1072px; margin:0 auto; padding:40px 16px 96px; }
  .caption { font-size:12px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }
  .intro { color:var(--ink-dim); font-size:14px; max-width:72ch; line-height:1.6; }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; margin:28px 0 8px; }
  .tab { font:600 14px Archivo; background:var(--surface); border:0; padding:12px 16px; min-height:44px; cursor:pointer; color:var(--ink-dim); }
  .tab[aria-selected="true"] { background:var(--ink); color:var(--ground); }
  .why { font-size:14px; color:var(--ink-dim); line-height:1.6; max-width:72ch; margin:16px 0 28px; }
  .why b { color:var(--ink); }
  .stage { position:relative; overflow:hidden; border:1px solid var(--rule); padding:32px; min-height:520px; }
  h1 { font-size:36px; font-weight:600; letter-spacing:-.02em; margin:0 0 24px; line-height:1; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); padding:0 12px 12px; }
  td { padding:14px 12px; vertical-align:middle; }
  .num { text-align:right; font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; }
  .unit { color:var(--ink-faint); }
  tbody tr.striped:nth-child(odd) { background:var(--surface); }
  .dim { color:var(--ink-dim); }
  .link { font:600 14px Archivo; color:var(--ink-dim); background:none; border:0; min-height:44px; padding:0 8px; cursor:pointer; }
  .link:hover { color:var(--accent); text-decoration:underline; text-underline-offset:4px; }
  .btn { font:600 14px Archivo; border:0; min-height:44px; padding:0 16px; cursor:pointer; }
  .btn.solid { background:var(--accent); color:#fff; }
  .btn.ghost { background:var(--surface); color:var(--ink); }
  input, select { font:16px Archivo; border:1px solid var(--control); background:var(--ground); padding:8px 10px; width:100%; color:var(--ink); }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  label { display:block; font-size:13px; font-weight:500; color:var(--ink-dim); margin-bottom:6px; }
  .field { margin-bottom:20px; }
  .clickrow { cursor:pointer; }
  .clickrow:hover td { background:var(--rule); }
  .chev { color:var(--ink-faint); text-align:right; width:24px; }

  /* option 1: inline */
  tr.editing td { background:#fff8f3 !important; padding:8px 12px; }
  /* option 2: drawer */
  .scrim { position:absolute; inset:0; background:rgba(32,35,32,.25); opacity:0; pointer-events:none; transition:opacity .2s; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .drawer { position:absolute; top:0; right:0; bottom:0; width:min(380px, 100%); background:var(--ground); padding:28px; transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.7,.3,1); box-shadow:-8px 0 24px rgba(0,0,0,.06); }
  .drawer.open { transform:none; }
  .drawer h2 { font-size:24px; margin:4px 0 4px; }
  .balance { font-family:"IBM Plex Mono"; font-size:28px; margin:16px 0 28px; }
  .danger { margin-top:32px; padding-top:20px; border-top:1px solid var(--rule); font-size:13px; color:var(--ink-dim); line-height:1.5; }
  /* option 3: detail page */
  .crumbs { font-size:14px; color:var(--ink-dim); margin-bottom:20px; }
  .crumbs button { font:inherit; }
  .detail-grid { display:grid; gap:40px; }
  @media (min-width: 800px) { .detail-grid { grid-template-columns: 1fr 300px; } }
  .figure { font-family:"IBM Plex Mono"; font-size:40px; letter-spacing:-.02em; margin:8px 0 4px; }
  .settings { background:var(--surface); padding:20px; }
  .tx { width:100%; }
  .muted-banner { background:var(--surface); color:var(--ink-dim); font-size:14px; padding:12px 14px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="caption">Tradinghub · accounts page</p>
  <h1 style="font-size:28px;margin-top:8px">Editing and archiving: three flows</h1>
  <p class="intro">The current page puts Edit and Archive on every row and opens a side column for edits. These three replace that. Everything is clickable.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-opt="inline" aria-selected="true">1 · Edit in the row</button>
    <button class="tab" role="tab" data-opt="drawer" aria-selected="false">2 · Account sheet</button>
    <button class="tab" role="tab" data-opt="page" aria-selected="false">3 · Account page (recommended)</button>
  </div>
  <p class="why" id="why"></p>
  <div class="stage" id="stage"></div>
</div>

<script>
const accounts = [
  { id:1, name:"Binance", type:"Crypto", balance:"0.4125", unit:"BTC", archived:false },
  { id:2, name:"Monzo", type:"Cash", balance:"1,240.50", unit:"GBP", archived:false },
  { id:3, name:"Old savings", type:"Cash", balance:"0", unit:"GBP", archived:true },
  { id:4, name:"Vanguard ISA", type:"Stocks", balance:"8,930.00", unit:"GBP", archived:false },
];
const WHY = {
  inline: "<b>Edit turns the row itself into fields</b>, with Save and Cancel where the actions were. Nothing pops up and nothing moves beside it. Archive leaves the row and sits inside edit mode, so the list shows one quiet action per row. Good for quick renames; cramped on a phone.",
  drawer: "<b>Rows have no buttons: click an account</b> and a sheet slides over from the right with its balance, its settings and, at the bottom, Archive. The list stays calm and full width. On a phone the sheet covers the screen, which is the native pattern there. One more click to edit than today.",
  page: "<b>Click an account to open its own page</b>: its balance, its transactions (Task 8 already needs this), and its settings beside them, with Archive at the bottom. An archived account's page says so, with Restore at the top. This is how banking apps work, it gives the back button and a shareable URL, and the list becomes a plain index with no buttons at all.",
};
let option = "inline";
let editingId = null;
let openId = null;

const active = () => accounts.filter((a) => !a.archived);
const archived = () => accounts.filter((a) => a.archived);
const money = (a) => `${a.balance} <span class="unit">${a.unit}</span>`;

function archivedGroup(rowFn) {
  if (!archived().length) return "";
  return `<tbody><tr><td colspan="9" style="padding-top:28px" class="caption">Archived (${archived().length})</td></tr></tbody>
          <tbody>${archived().map(rowFn).join("")}</tbody>`;
}

function renderInline() {
  const row = (a) => editingId === a.id ? `
    <tr class="editing">
      <td><input value="${a.name}" aria-label="Name"></td>
      <td><select aria-label="Type"><option>${a.type}</option><option>Cash</option><option>Crypto</option><option>Stocks</option></select></td>
      <td class="num">${money(a)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="link" data-act="archive" data-id="${a.id}">${a.archived ? "Restore" : "Archive"}</button>
        <button class="btn ghost" data-act="cancel">Cancel</button>
        <button class="btn solid" data-act="cancel">Save</button>
      </td>
    </tr>` : `
    <tr class="${a.archived ? "" : "striped"}" style="${a.archived ? "color:var(--ink-faint)" : ""}">
      <td>${a.name}</td><td class="dim">${a.type}</td><td class="num">${money(a)}</td>
      <td style="text-align:right"><button class="link" data-act="edit" data-id="${a.id}">Edit</button></td>
    </tr>`;
  return `<h1>Accounts</h1><table>
    <thead><tr><th>Name</th><th>Type</th><th style="text-align:right">Balance</th><th></th></tr></thead>
    <tbody>${active().map(row).join("")}</tbody>${archivedGroup(row)}</table>`;
}

function renderDrawer() {
  const row = (a) => `
    <tr class="clickrow ${a.archived ? "" : "striped"}" data-act="open" data-id="${a.id}" style="${a.archived ? "color:var(--ink-faint)" : ""}">
      <td>${a.name}</td><td class="dim">${a.type}</td><td class="num">${money(a)}</td><td class="chev">›</td>
    </tr>`;
  const a = accounts.find((x) => x.id === openId);
  return `<h1>Accounts</h1><table>
    <thead><tr><th>Name</th><th>Type</th><th style="text-align:right">Balance</th><th></th></tr></thead>
    <tbody>${active().map(row).join("")}</tbody>${archivedGroup(row)}</table>
    <div class="scrim ${a ? "open" : ""}" data-act="close"></div>
    <aside class="drawer ${a ? "open" : ""}">${a ? `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="caption">${a.archived ? "Archived account" : "Account"}</span>
        <button class="link" data-act="close" aria-label="Close">Close</button>
      </div>
      <h2>${a.name}</h2>
      <div class="balance">${money(a)}</div>
      <div class="field"><label>Name</label><input value="${a.name}"></div>
      <div class="field"><label>Unit</label><input value="${a.unit}"></div>
      <div class="field"><label>Type</label><select><option>${a.type}</option></select></div>
      <button class="btn solid" style="width:100%" data-act="close">Save</button>
      <div class="danger">${a.archived
        ? `Archived accounts are hidden from the list. <br><button class="link" style="padding:0;color:var(--accent)" data-act="archive" data-id="${a.id}">Restore account</button>`
        : `Closed this account? Archiving hides it and keeps its history. <br><button class="link" style="padding:0" data-act="archive" data-id="${a.id}">Archive account</button>`}
      </div>` : ""}
    </aside>`;
}

function renderPage() {
  const a = accounts.find((x) => x.id === openId);
  if (!a) {
    const row = (x) => `
      <tr class="clickrow ${x.archived ? "" : "striped"}" data-act="open" data-id="${x.id}" style="${x.archived ? "color:var(--ink-faint)" : ""}">
        <td>${x.name}</td><td class="dim">${x.type}</td><td class="num">${money(x)}</td><td class="chev">›</td>
      </tr>`;
    return `<h1>Accounts</h1><table>
      <thead><tr><th>Name</th><th>Type</th><th style="text-align:right">Balance</th><th></th></tr></thead>
      <tbody>${active().map(row).join("")}</tbody>${archivedGroup(row)}</table>`;
  }
  return `
    <div class="crumbs"><button class="link" style="padding:0" data-act="close">‹ Accounts</button></div>
    ${a.archived ? `<div class="muted-banner"><span>This account is archived and hidden from your list.</span><button class="btn ghost" data-act="archive" data-id="${a.id}">Restore</button></div>` : ""}
    <div class="detail-grid">
      <div>
        <span class="caption">${a.type} · ${a.unit}</span>
        <h1 style="margin:8px 0 0">${a.name}</h1>
        <div class="figure">${money(a)}</div>
        <p class="caption" style="margin-top:36px">Recent transactions</p>
        <table class="tx">
          <tr class="striped"><td class="dim">14 Nov</td><td>Groceries</td><td class="num">−42.10 <span class="unit">${a.unit}</span></td></tr>
          <tr class="striped"><td class="dim">12 Nov</td><td>Salary</td><td class="num">2,400.00 <span class="unit">${a.unit}</span></td></tr>
          <tr class="striped"><td class="dim">9 Nov</td><td>Transfer to Vanguard</td><td class="num">−500.00 <span class="unit">${a.unit}</span></td></tr>
        </table>
      </div>
      <aside>
        <div class="settings">
          <p class="caption" style="margin:0 0 16px">Settings</p>
          <div class="field"><label>Name</label><input value="${a.name}"></div>
          <div class="field"><label>Unit</label><input value="${a.unit}"></div>
          <div class="field"><label>Type</label><select><option>${a.type}</option></select></div>
          <button class="btn solid" style="width:100%">Save changes</button>
        </div>
        ${a.archived ? "" : `<div class="danger">Closed this account? Archiving hides it from your list and keeps its history.<br>
          <button class="link" style="padding:0" data-act="archive" data-id="${a.id}">Archive account</button></div>`}
      </aside>
    </div>`;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.opt === option));
  document.getElementById("why").innerHTML = WHY[option];
  document.getElementById("stage").innerHTML = { inline: renderInline, drawer: renderDrawer, page: renderPage }[option]();
}

document.querySelector(".tabs").onclick = (e) => {
  const opt = e.target.closest(".tab")?.dataset.opt;
  if (opt) { option = opt; editingId = null; openId = null; render(); }
};
document.getElementById("stage").onclick = (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const id = Number(el.dataset.id);
  const act = el.dataset.act;
  if (act === "edit") editingId = id;
  if (act === "cancel") editingId = null;
  if (act === "open") openId = id;
  if (act === "close") openId = null;
  if (act === "archive") { const a = accounts.find((x) => x.id === id); a.archived = !a.archived; editingId = null; if (option === "drawer") openId = null; }
  render();
};
render();
</script>
</body>
</html>
